version: 2.1

# Build, tests, packaging and Deployer contract checks. No publication or deployment.
jobs:
  build-and-test:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Check Docker and Compose
          command: |
            docker version
            docker compose version
      - run:
          name: Validate four starter profiles
          command: bash ./ops/starter/tests/create-project.sh
      - run:
          name: Build WordPress
          command: ./ops/build
      - run:
          name: Validate build
          command: ./ops/test
      - run:
          name: Integration smoke
          command: ./ops/smoke

  consumer-integration:
    parameters:
      profile:
        type: enum
        enum: ["headless", "standard"]
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Generate, resolve, build and smoke << parameters.profile >> consumer
          command: bash ./ops/starter/tests/consume-project.sh << parameters.profile >>

workflows:
  verify:
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore: /^task\/.*/
      - consumer-integration:
          matrix:
            parameters:
              profile: ["headless", "standard"]
          filters:
            branches:
              ignore: /^task\/.*/
