steps:
  - label: ":wordpress: Build & smoke"
    key: "build-smoke"
    command:
      - "./ops/test"
      - "./ops/smoke"
    timeout_in_minutes: 10
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - label: ":shield: Dependency audit"
    depends_on: "build-smoke"
    command:
      - "./ops/audit"
    timeout_in_minutes: 5
    soft_fail: true
    checkout:
      ssh_secret: "GITEA_SSH_KEY"