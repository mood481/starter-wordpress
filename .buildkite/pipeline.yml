steps:
  - label: ":wordpress: Build, smoke & package"
    key: "release"
    command:
      - "./ops/test"
      - "./ops/smoke"
      - "./ops/package"
      - 'buildkite-agent artifact upload "dist/*"'
    timeout_in_minutes: 10
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - label: ":shield: Dependency audit"
    command:
      - "./ops/audit"
    timeout_in_minutes: 5
    soft_fail: true
    checkout:
      ssh_secret: "GITEA_SSH_KEY"