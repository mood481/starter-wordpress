steps:
  - label: ":wordpress: Build & validate"
    key: "validate"
    if: 'build.env("DEPLOY_ACTION") != "rollback"'
    command:
      - "./ops/build"
      - "./ops/test"
      - "./ops/smoke"
      - |
        if [ "${BUILDKITE_BRANCH:-}" = "main" ] || \
           [ "${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-}" = "main" ]; then
          ./ops/package
          buildkite-agent artifact upload "dist/*"
        else
          echo "==> Skipping release package for non-main branch build"
        fi
    timeout_in_minutes: 10
    secrets:
      COMPOSER_AUTH: "WP_GEAR_COMPOSER_AUTH"
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - label: ":shield: Audit release dependencies"
    key: "audit"
    depends_on: "validate"
    if: 'build.branch == "main" && build.env("GEAR_RELEASE_TAG") != null && build.env("DEPLOY_ACTION") != "rollback"'
    command:
      - "./ops/audit"
    timeout_in_minutes: 5
    secrets:
      COMPOSER_AUTH: "WP_GEAR_COMPOSER_AUTH"
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - block: ":rocket: Approve test deployment"
    key: "deploy-approval"
    prompt: "Deploy the release artifact produced by this tag?"
    depends_on:
      - "validate"
      - "audit"
    if: 'build.branch == "main" && build.env("GEAR_RELEASE_TAG") != null && build.env("DEPLOY_ACTION") != "rollback"'

  - label: ":rocket: Deploy test site"
    key: "deploy"
    depends_on:
      - "validate"
      - "audit"
      - "deploy-approval"
    if: 'build.branch == "main" && build.env("GEAR_RELEASE_TAG") != null && build.env("DEPLOY_ACTION") != "rollback"'
    command:
      - 'buildkite-agent artifact download "dist/*" .'
      - "./ops/ci/deployer deploy -v"
    timeout_in_minutes: 10
    concurrency: 1
    concurrency_group: "wordpress-gear-test-deploy"
    secrets:
      DEPLOY_CONFIG: "WP_GEAR_DEPLOY_CONFIG"
      DEPLOY_SSH_KEY: "MAIN_SSH_KEY"
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - block: ":rewind: Approve test rollback"
    key: "rollback-approval"
    prompt: "Roll back the test site to the previous good Deployer release?"
    if: 'build.source == "ui" && build.branch == "main" && build.env("DEPLOY_ACTION") == "rollback"'

  - label: ":rewind: Roll back test site"
    key: "rollback"
    depends_on: "rollback-approval"
    if: 'build.source == "ui" && build.branch == "main" && build.env("DEPLOY_ACTION") == "rollback"'
    command:
      - "./ops/ci/deployer rollback -v"
    timeout_in_minutes: 10
    concurrency: 1
    concurrency_group: "wordpress-gear-test-deploy"
    secrets:
      DEPLOY_CONFIG: "WP_GEAR_DEPLOY_CONFIG"
      DEPLOY_SSH_KEY: "MAIN_SSH_KEY"
    checkout:
      ssh_secret: "GITEA_SSH_KEY"