steps:
  - label: ":wordpress: Build, smoke & package"
    key: "release"
    command:
      - "./ops/test"
      - "./ops/smoke"
      - "./ops/package"
      - 'buildkite-agent artifact upload "dist/*"'
    timeout_in_minutes: 10
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - label: ":shield: Dependency audit"
    key: "audit"
    command:
      - "./ops/audit"
    timeout_in_minutes: 5
    soft_fail: true
    checkout:
      ssh_secret: "GITEA_SSH_KEY"

  - block: ":rocket: Deploy test site"
    key: "deploy-approval"
    prompt: "Deploy the artifact produced by this build?"
    depends_on:
      - "release"
      - "audit"
    if: 'build.branch == "main"'

  - label: ":rocket: Deploy test site"
    key: "deploy"
    depends_on:
      - "release"
      - "deploy-approval"
    if: 'build.branch == "main"'
    command:
      - 'buildkite-agent artifact download "dist/*" .'
      - "./ops/ci/deployer deploy -v"
    timeout_in_minutes: 10
    secrets:
      DEPLOY_CONFIG: "WP_GEAR_DEPLOY_CONFIG"
      DEPLOY_SSH_KEY: "MAIN_SSH_KEY"
    checkout:
      ssh_secret: "GITEA_SSH_KEY"
